<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Strong evidence is specific about what it does not prove">
  <rect width="1920" height="1080" fill="#07090d"/>
  <rect x="0" y="0" width="18" height="1080" fill="#25f4ee"/>
  <rect x="18" y="0" width="7" height="1080" fill="#fe2c55"/>
  <text x="92" y="112" fill="#f7f9fc" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="64" font-weight="750">Strong evidence is specific about what it does not prove</text>
  <text x="94" y="168" fill="#aeb8c5" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="27">Correctness first · whole-model timing second · publication claims last</text>
  
  <rect x="92" y="230" width="825" height="650" rx="34" fill="#11151c" stroke="#52e08a" stroke-width="3"/>
  <text x="142" y="302" fill="#52e08a" font-family="-apple-system, sans-serif" font-size="30" font-weight="800">WHAT THE EVIDENCE PROVES</text>
  <text x="142" y="382" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ Rows 1–13 beat baseline in three full sessions</text>
  <text x="142" y="449" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ 117/117 fresh float32 comparisons pass</text>
  <text x="142" y="516" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ Row 14 executes with bounded attention memory</text>
  <text x="142" y="583" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ S8192 reference + continuity checks pass</text>
  <text x="142" y="650" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ Sources, licences + six hashes are locked</text>
  <text x="142" y="717" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">✓ Unsupported native paths fail closed</text>
  <rect x="142" y="775" width="685" height="58" rx="16" fill="#16272b"/>
  <text x="172" y="814" fill="#52e08a" font-family="-apple-system, sans-serif" font-size="23" font-weight="700">DEVICE-SPECIFIC · REPEATABLE · AUDITABLE</text>
  <rect x="949" y="230" width="877" height="650" rx="34" fill="#11151c" stroke="#fe2c55" stroke-width="3"/>
  <text x="999" y="302" fill="#fe2c55" font-family="-apple-system, sans-serif" font-size="30" font-weight="800">WHAT THE EVIDENCE DOES NOT PROVE</text>
  <text x="999" y="382" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× No official MFU or combined organizer score</text>
  <text x="999" y="449" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× No full S100000 explicit-reference equality</text>
  <text x="999" y="516" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× No CUDA, ROCm or other-Mac portability claim</text>
  <text x="999" y="583" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× No causal claim from cross-session latency drift</text>
  <text x="999" y="650" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× Power state was not inspected or controlled</text>
  <text x="999" y="717" fill="#f7f9fc" font-family="-apple-system, sans-serif" font-size="31" font-weight="650">× No redistribution right for organizer attachments</text>
  <rect x="999" y="775" width="735" height="58" rx="16" fill="#27171c"/>
  <text x="1029" y="814" fill="#fe2c55" font-family="-apple-system, sans-serif" font-size="23" font-weight="700">LIMITATIONS STAY VISIBLE IN THE SAME FRAME</text>
  <text x="94" y="1028" fill="#aeb8c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">TikTok TechJam 2026 · Track 3 · evidence card generated from CHAMPION_MANIFEST.json</text>
